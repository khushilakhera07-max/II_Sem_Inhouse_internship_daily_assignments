<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKIT College Admission Form</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background-image:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("College photo(2).webp");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{

    width:460px;
    background:rgba(172, 33, 33, 0.18);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 35px rgba(122, 36, 36, 0.5);
    color:white;

}

h2{

    text-align:center;
    margin-bottom:25px;
    font-size:30px;

}

label{

    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;

}

input,
select,
textarea{

    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:15px;

}

textarea{

    resize:none;

}

.gender{

    display:flex;
    gap:20px;
    margin-top:8px;

}

.gender label{

    font-weight:normal;

}

.gender input{

    width:auto;

}

button{

    width:100%;
    margin-top:25px;
    padding:14px;
    background:#00bcd4;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;

}

button:hover{

    background:#2e0a48;
    transform:scale(1.03);

}

@media(max-width:500px){

.container{

    width:90%;

}

}

</style>

</head>

<body>

<div class="container">

<h2>College Admission Form</h2>

<form>

<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>

<label>Email Address</label>
<input type="email" placeholder="Enter your email" required>

<label>Phone Number</label>
<input type="tel" placeholder="Enter your phone number" required>

<label>Date of Birth</label>
<input type="date" required>

<label>Gender</label>

<div class="gender">

<label><input type="radio" name="gender"> Male</label>

<label><input type="radio" name="gender"> Female</label>

<label><input type="radio" name="gender"> Other</label>

</div>

<label>Select Course</label>

<select required>

<option value="">Select Course</option>

<option>B.Tech</option>

<option>M.Tech</option>

<option>BCA</option>

<option>MCA</option>

<option>BBA</option>

<option>MBA</option>

</select>

<label>Select Branch</label>

<select required>

<option value="">Select Branch</option>

<option>Computer Science Engineering (CSE)</option>

<option>Information Technology (IT)</option>

<option>Artificial Intelligence & Data Science (AI-DS)</option>

<option>Electronics & Communication Engineering (ECE)</option>

<option>Electrical Engineering (EE)</option>

<option>Mechanical Engineering (ME)</option>

<option>Civil Engineering (CE)</option>

</select>

<label>Address</label>

<textarea rows="4" placeholder="Enter your address"></textarea>

<button type="submit">Register Now</button>

</form>

</div>

</body>
</html>
