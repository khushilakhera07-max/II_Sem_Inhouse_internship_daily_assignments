<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live User Directory</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f3ff, #eef2ff);
            font-family: Arial, sans-serif;
        }

        .header {
            background: linear-gradient(135deg, #6f42c1, #8b5cf6);
            color: white;
            padding: 35px 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .header h1 {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .user-badge {
            background-color: white;
            color: #6f42c1;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-top: 8px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: -20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 0.2rem rgba(139, 92, 246, 0.2);
        }

        .user-card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
            height: 100%;
            transition: 0.3s ease;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
        }

        .user-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 12px 28px rgba(111, 66, 193, 0.2);
        }

        .card-top {
            height: 80px;
            background: linear-gradient(135deg, #6f42c1, #a78bfa);
        }

        .avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 5px solid white;
            background: #ede9fe;
            color: #6f42c1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            margin: -45px auto 15px;
            position: relative;
        }

        .user-card .card-body {
            text-align: center;
            padding: 20px;
        }

        .user-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .username {
            color: #8b5cf6;
            margin-bottom: 15px;
        }

        .user-info {
            text-align: left;
            color: #555;
            font-size: 14px;
            margin-bottom: 8px;
            word-break: break-word;
        }

        #loading {
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .spinner-border {
            color: #7c3aed;
            width: 3rem;
            height: 3rem;
        }

        #errorBox {
            display: none;
            text-align: center;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .retry-btn {
            background: #7c3aed;
            color: white;
            border: none;
        }

        .retry-btn:hover {
            background: #5b21b6;
            color: white;
        }

        #noResults {
            display: none;
            text-align: center;
            padding: 40px;
            color: #777;
        }

        @media (max-width: 576px) {
            .header h1 {
                font-size: 26px;
            }

            .controls {
                margin-top: 15px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>Live User Directory</h1>
        <p>Browse and search users in real time</p>

        <span class="user-badge">
            Users: <span id="userCount">0</span>
        </span>
    </header>


    <main class="container py-4">

        <div class="controls mb-4">

            <div class="row g-3">

                <div class="col-md-8">
                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="🔍 Search user by name..."
                    >
                </div>

                <div class="col-md-4">
                    <select id="sortSelect" class="form-select">
                        <option value="default">Sort Users</option>
                        <option value="az">Name: A to Z</option>
                        <option value="za">Name: Z to A</option>
                    </select>
                </div>

            </div>

        </div>

        <div id="loading">

            <div
                class="spinner-border"
                role="status">
            </div>

            <p class="mt-3">
                Loading users...
            </p>

        </div>


        <div id="errorBox">

            <h3>⚠️ Unable to Load Users</h3>

            <p>
                Please check your internet connection
                and try again.
            </p>

            <button
                class="btn retry-btn px-4"
                onclick="fetchUsers()"
            >
                Retry
            </button>

        </div>


       
        <div id="noResults">

            <h4>No users found 😕</h4>

            <p>
                Try searching with another name.
            </p>

        </div>


        <div
            class="row g-4"
            id="userContainer">
        </div>

    </main>


    <script>

        let allUsers = [];


        const customUsers = [

            {
                name: "Khushi",
                username: "khushi07",
                email: "khushi16@gmail.com",
                phone: "9876543210",
                website: "khushi.com",
                company: {
                    name: "Tech Innovators"
                },
                address: {
                    city: "Banglore"
                }
            },

            {
                name: "Khushbu",
                username: "khushbu62",
                email: "khushbu28@gmail.com",
                phone: "9876543211",
                website: "khushbu.com",
                company: {
                    name: "Creative Solutions"
                },
                address: {
                    city: "Delhi"
                }
            },

            {
                name: "Kratika",
                username: "kratika49",
                email: "kratika37@gmail.com",
                phone: "9876543212",
                website: "kratika.com",
                company: {
                    name: "Digital World"
                },
                address: {
                    city: "Mumbai"
                }
            },

            {
                name: "Bheem",
                username: "bheem05",
                email: "bheem12@gmail.com",
                phone: "9876543213",
                website: "bheem.com",
                company: {
                    name: "Code Masters"
                },
                address: {
                    city: "Pune"
                }
            },

            {
                name: "Gaurav",
                username: "gaurav62",
                email: "gaurav85@gmail.com",
                phone: "9876543214",
                website: "gaurav.com",
                company: {
                    name: "Web Solutions"
                },
                address: {
                    city: "Kota"
                }
            },

            {
                name: "Aryan",
                username: "aryan04",
                email: "aryan17@gmail.com",
                phone: "9876543215",
                website: "aryan.com",
                company: {
                    name: "Future Technologies"
                },
                address: {
                    city: "Jaipur"
                }
            }

        ];

        function fetchUsers() {

            const loading =
                document.getElementById("loading");

            const errorBox =
                document.getElementById("errorBox");

            const userContainer =
                document.getElementById("userContainer");


            loading.style.display = "flex";

            errorBox.style.display = "none";

            userContainer.innerHTML = "";

            fetch("https://jsonplaceholder.typicode.com/users")

                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Failed to fetch users"
                        );

                    }

                    return response.json();

                })


                .then(data => {

                    console.log(
                        "Users fetched successfully:",
                        data
                    );

                    allUsers = customUsers;

                    loading.style.display = "none";


                    displayUsers(allUsers);

                })

                .catch(error => {

                    console.error(
                        "Error:",
                        error
                    );


                    loading.style.display = "none";


                    errorBox.style.display = "block";

                    document
                        .getElementById("userCount")
                        .textContent = "0";

                });

        }

        function displayUsers(users) {

            const container =
                document.getElementById(
                    "userContainer"
                );


            const noResults =
                document.getElementById(
                    "noResults"
                );


            const userCount =
                document.getElementById(
                    "userCount"
                );

            container.innerHTML = "";


      
            userCount.textContent =
                users.length;


            if (users.length === 0) {

                noResults.style.display =
                    "block";

                return;

            }

            else {

                noResults.style.display =
                    "none";

            }


            users.forEach(user => {


                const initials =
                    user.name
                        .charAt(0)
                        .toUpperCase();


                const card = `

                    <div
                        class="col-12 col-sm-6 col-lg-4"
                    >

                        <div
                            class="card user-card"
                        >

                            <div
                                class="card-top"
                            >
                            </div>


                            <div
                                class="avatar"
                            >
                                ${initials}
                            </div>


                            <div
                                class="card-body"
                            >

                                <h5
                                    class="user-name"
                                >
                                    ${user.name}
                                </h5>


                                <p
                                    class="username"
                                >
                                    @${user.username}
                                </p>


                                <div
                                    class="user-info"
                                >
                                    📧 ${user.email}
                                </div>


                                <div
                                    class="user-info"
                                >
                                    📞 ${user.phone}
                                </div>


                                <div
                                    class="user-info"
                                >
                                    🌐 ${user.website}
                                </div>


                                <div
                                    class="user-info"
                                >
                                    🏢 ${user.company.name}
                                </div>


                                <div
                                    class="user-info"
                                >
                                    📍 ${user.address.city}
                                </div>

                            </div>

                        </div>

                    </div>

                `;


                container.innerHTML += card;

            });

        }


        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                filterAndSortUsers
            );



        document
            .getElementById("sortSelect")
            .addEventListener(
                "change",
                filterAndSortUsers
            );


        function filterAndSortUsers() {


            const searchText =

                document
                    .getElementById(
                        "searchInput"
                    )
                    .value
                    .toLowerCase();

            const sortValue =

                document
                    .getElementById(
                        "sortSelect"
                    )
                    .value;


            let filteredUsers =

                allUsers.filter(user =>

                    user.name
                        .toLowerCase()
                        .includes(searchText)

                );

            if (sortValue === "az") {

                filteredUsers.sort(

                    (a, b) =>

                        a.name.localeCompare(
                            b.name
                        )

                );

            }

            else if (
                sortValue === "za"
            ) {

                filteredUsers.sort(

                    (a, b) =>

                        b.name.localeCompare(
                            a.name
                        )

                );

            }



           
            displayUsers(
                filteredUsers
            );

        }



       
        fetchUsers();

    </script>



    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    >
    </script>

</body>
</html>
