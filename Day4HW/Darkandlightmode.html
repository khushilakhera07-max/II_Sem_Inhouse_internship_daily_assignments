<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKIT College Admission Form</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background-image:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("College photo(2).webp");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:0.4s;
}


.theme-btn{
    position:fixed;
    top:20px;
    right:20px;
    background:#ffffff;
    color:#222;
    border:none;
    padding:12px 20px;
    border-radius:30px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
    transition:.3s;
}

.theme-btn:hover{
    transform:scale(1.08);
}



.container{
    width:460px;
    background:rgba(172,33,33,0.18);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 35px rgba(122,36,36,0.5);
    color:white;
    transition:.4s;
}

h2{
    text-align:center;
    margin-bottom:25px;
    font-size:30px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:15px;
    transition:.3s;
}

textarea{
    resize:none;
}

.gender{
    display:flex;
    gap:20px;
    margin-top:8px;
}

.gender label{
    font-weight:normal;
}

.gender input{
    width:auto;
}

button.submit-btn{
    width:100%;
    margin-top:25px;
    padding:14px;
    background:#00bcd4;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button.submit-btn:hover{
    background:#2e0a48;
    transform:scale(1.03);
}



body.light{
    background-image:
    linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,.55)),
    url("College photo(2).webp");
}

body.light .container{
    background:rgba(255,255,255,.88);
    color:#222;
}

body.light input,
body.light select,
body.light textarea{
    background:#f2f2f2;
    color:#222;
}

body.light .submit-btn{
    background:#0066ff;
}

body.light .submit-btn:hover{
    background:#0047b3;
}

body.light .theme-btn{
    background:#222;
    color:white;
}



body.dark{
    background-image:
    linear-gradient(rgba(0,0,0,.60), rgba(0,0,0,.60)),
    url("College photo(2).webp");
}

body.dark .container{
    background:rgba(0,0,0,.35);
    color:white;
}

body.dark input,
body.dark select,
body.dark textarea{
    background:rgba(255,255,255,.15);
    color:white;
}

body.dark input::placeholder,
body.dark textarea::placeholder{
    color:#ddd;
}

body.dark .theme-btn{
    background:white;
    color:black;
}

@media(max-width:500px){

.container{
    width:90%;
}

}

</style>

</head>

<body class="dark">

<button class="theme-btn" onclick="toggleTheme()">☀ Light Mode</button>

<div class="container">

<h2>College Admission Form</h2>

<form>

<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>

<label>Email Address</label>
<input type="email" placeholder="Enter your email" required>

<label>Phone Number</label>
<input type="tel" placeholder="Enter your phone number" required>

<label>Date of Birth</label>
<input type="date" required>

<label>Gender</label>

<div class="gender">

<label><input type="radio" name="gender"> Male</label>

<label><input type="radio" name="gender"> Female</label>

<label><input type="radio" name="gender"> Other</label>

</div>

<label>Select Course</label>

<select required>

<option value="">Select Course</option>

<option>B.Tech</option>

<option>M.Tech</option>

<option>BCA</option>

<option>MCA</option>

<option>BBA</option>

<option>MBA</option>

</select>

<label>Select Branch</label>

<select required>

<option value="">Select Branch</option>

<option>Computer Science Engineering (CSE)</option>

<option>Information Technology (IT)</option>

<option>Artificial Intelligence & Data Science (AI-DS)</option>

<option>Electronics & Communication Engineering (ECE)</option>

<option>Electrical Engineering (EE)</option>

<option>Mechanical Engineering (ME)</option>

<option>Civil Engineering (CE)</option>

</select>

<label>Address</label>

<textarea rows="4" placeholder="Enter your address"></textarea>

<button class="submit-btn" type="submit">Register Now</button>

</form>

</div>

<script>

function toggleTheme(){

    const body = document.body;
    const btn = document.querySelector(".theme-btn");

    if(body.classList.contains("dark")){
        body.classList.remove("dark");
        body.classList.add("light");
        btn.innerHTML="🌙 Dark Mode";
    }
    else{
        body.classList.remove("light");
        body.classList.add("dark");
        btn.innerHTML="☀ Light Mode";
    }

}

</script>

</body>
</html>
